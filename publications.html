<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publications — Niraj Kumar</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="nav">
    <div class="inner">
      <div class="brand"><a href="/index.html">Niraj Kumar</a></div>
      <a href="/publications.html">Publications</a>
      <a href="/cv.html">CV</a>
      <a href="/misc.html">Miscellaneous</a>
    </div>
  </div>

  <div class="container">
    <h1>Publications</h1>
    <div id="pubs" class="list"></div>
    <div class="footer">© 2025 Niraj Kumar</div>
  </div>

  <script>
  async function load() {
    try {
      const r = await fetch('/assets/publications.json');
      const items = await r.json();
      const el = document.getElementById('pubs');
      el.innerHTML = items.map(p => `
        <article class="card pub">
          <div><strong>${p.title || 'Untitled'}</strong></div>
          <div class="meta">${p.authors || ''}${p.venue ? ' · ' + p.venue : ''}${p.year ? ' · ' + p.year : ''}</div>
          <div class="small">${(p.links||[]).map(L => `<a href="${L.url}" target="_blank" rel="noopener">${L.label}</a>`).join(' · ')}</div>
        </article>
      `).join('');
    } catch(e) {
      document.getElementById('pubs').innerHTML = '<p class="small">No publications yet.</p>';
    }
  }
  load();
  </script>
</body>
</html>
